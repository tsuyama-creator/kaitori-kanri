<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>買取・下取り管理</title>
<style>
:root{--navy:#1F3A5F;--bg:#F4F5F7;--line:#E3E5E8;--ink:#202124;--sub:#5F6368;--qr:#FFF4D1;--qrl:#E8D59A}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:12px}
h1{margin:0;font-size:20px}
h2{margin:0;font-size:15px}
.icon{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid #C9CDD2;border-radius:10px;background:#fff}
.search input{border:none;outline:none;flex:1;min-width:0;font-size:16px;background:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fc{height:36px;padding:0 14px;border-radius:18px;border:1px solid #C9CDD2;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer}
.fc.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
main{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.ok{background:#E2F3E7;color:#1B5E31}.ng{background:#FCE4E2;color:#A1150D}.wt{background:#FDEFC8;color:#6B4300}.ac{background:#E3EDFD;color:#0B47A8}.gy{background:#E6E8EB;color:#3C4043}.pu{background:#EEE5FA;color:#55279A}
.alert{background:#FCE4E2;color:#7D1009;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.card .nm{font-size:17px;font-weight:700}
.empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:5}
.btn{height:52px;border-radius:12px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;width:100%}
.btn.p{background:var(--navy);color:#fff}
.btn.s{height:44px;font-size:15px}
.link{background:none;border:none;color:var(--navy);text-decoration:underline;font-size:14px;padding:8px;cursor:pointer}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
details.sec{padding:0;gap:0}
details.sec>summary{list-style:none;padding:14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:15px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:4px;min-width:0}
.in{height:44px;border:1px solid #C9CDD2;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;width:100%;min-width:0;color:var(--ink)}
.in.qr{background:var(--qr);border-color:var(--qrl)}
.in.dirty{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.seg{display:flex;border:1px solid #C9CDD2;border-radius:10px;overflow:hidden}
.so{flex:1;height:42px;border:none;border-right:1px solid #C9CDD2;background:#fff;font-size:14px;cursor:pointer;padding:0 4px}
.so:last-child{border-right:none}
.seg.many{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.many .so{border-bottom:1px solid #C9CDD2}
.seg.many .so:nth-child(3n){border-right:none}
.seg.many .so:nth-last-child(-n+3){border-bottom:none}
.so.on{background:var(--navy);color:#fff;font-weight:700}
.ck{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.ck input{width:22px;height:22px;accent-color:var(--navy);margin:0}
.ok-banner{background:#E2F3E7;color:#1B5E31;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.err{color:#A1150D;font-size:13px}
.steps{display:flex;flex-direction:column}
.st{display:flex;gap:12px}
.st .rail{display:flex;flex-direction:column;align-items:center;width:22px}
.dot{width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.d-done{background:#1B7A3D}.d-now{background:#fff;border:3px solid #C77700}.d-next{background:#fff;border:2px solid #B8BDC3}
.ln{width:2px;flex:1;min-height:14px;background:#D0D4D8}
.st .tx{display:flex;flex-direction:column;gap:2px;padding-bottom:14px}
.t-now{font-weight:700}.t-next{color:var(--sub)}
.scan{background:#121417;color:#fff;min-height:100vh;min-height:100dvh}
.view{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:300px}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:relative;width:min(78vw,320px);aspect-ratio:1;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.sheet{background:#fff;color:var(--ink);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.code{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14px;border:1px dashed #B8BDC3;color:var(--sub)}
.code.done{border:none;background:#E2F3E7;color:#1B5E31}
.code.part{border:1px solid #E8B93A;background:#FFF8E1;color:#6B4300}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:40;font-size:15px;color:var(--navy);font-weight:700}
.grid2 .full{grid-column:1/-1}
.dwrap{display:flex;align-items:center;gap:8px;min-width:0}
.dwrap .in{flex:1;min-width:0}
.era{font-size:13px;color:var(--navy);font-weight:600;white-space:nowrap}
.hist{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script>
/* ===== 設定 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycby9kQ1lx5GKsgcHJeVAE8-HzpNHOL8K_S6bCogx83ayCBr2LlVHbCDFhOds1o_aPQ6TNg/exec'; // GASのウェブアプリURL
const TOKEN = '13QIDk_QVNlkQlqzMaaW8lHc';                                            // Code.gs の TOKEN と同じ値
const SHEET_URL = '';                                                 // スプレッドシートのURL（任意）

/* ===== 項目定義（Code.gs と同じ見出し） ===== */
const METHODS = ['未定', '出品', '解体', '再販', '社用車', 'レンタカー'];
const KEI_FREE = ['委任状', '譲渡証', '印鑑証明'];   // 軽自動車では不要
const MEIGI = ['一時抹消', '自社名変', 'お客様名義のまま'];
const DOCS = ['車検証', '自賠責', '印鑑証明', '委任状', '譲渡証', 'リサイクル券', '納税証明'];
const F = {
  docs: [['車検証','doc'],['自賠責','doc'],['印鑑証明','doc'],['印鑑期限','date'],['委任状','doc'],['譲渡証','doc'],['リサイクル券','doc'],['納税証明','doc'],['住民票等','doc']],
  owner: [['要否','enum:不要,要'],['所有者','text'],['残債','enum:無,有'],['精算日','date'],['解除書類','enum:未着,着'],['解除状況','enum:依頼前,依頼中,完了']],
  meigi: [['名義処理','enum:' + MEIGI.join(',')],['申請日','date'],['完了日','date'],['還付手続','enum:未,済,対象外']],
  money: [['査定額','yen'],['買取額','yen'],['支払予定','date'],['支払','enum:未,済,値引充当'],['新車注文No','text'],['新車納車','date']],
  basic: [['区分','enum:買取,下取'],['軽・普通','enum:軽,普通'],['入庫日','date'],['担当','list:担当'],['車名','text'],['登録番号','text'],['車台番号','text'],['車検満了','date'],['走行距離','num'],['保管場所','list:保管場所']],
  '出品': [['会場','list:会場'],['出品予定','date'],['陸送業者','list:陸送業者'],['陸送依頼','date'],['引取予定','date'],['引取日','date'],['出品番号','text'],['結果','enum:落札,流札,取消'],['落札額','yen'],['入金予定','date'],['入金日','date']],
  '解体': [['解体業者','list:解体業者'],['引取場所','list:保管場所'],['引取予定','date'],['引取日','date'],['解体証明','date'],['スクラップ額','yen']],
  '再販': [['作業内容','text'],['作業先','list:作業先'],['作業開始','date'],['仕上がり予定','date'],['作業完了','date'],['展示場所','list:保管場所'],['展示予定','date'],['販売価格','yen'],['販売日','date']]
};

/* ===== 状態 ===== */
const S = { rows: null, options: { models: {} }, filter: 'すべて', q: '', draft: null, detail: null, scan: null };
const app = document.getElementById('app');

/* ===== 共通 ===== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* 和暦：R8.4.12 / 8.4.12（令和）/ 令和8年4月12日 / 2026-04-12 / Date → 「R8.04.12」。読めないときは入力のまま返す */
const ERAS = [['R', 2018, '2019-05-01'], ['H', 1988, '1989-01-08'], ['S', 1925, '1926-12-25']];
const pad2 = n => String(n).padStart(2, '0');
function toWareki(v) {
  if (!v) return '';
  let y, m, d;
  if (v instanceof Date) { y = v.getFullYear(); m = v.getMonth() + 1; d = v.getDate(); }
  else {
    const t = String(v).trim().replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[．。／ー－年月\/\-]/g, '.').replace(/日|\s/g, '').replace('元', '1');
    let a = /^(\d{4})\.(\d{1,2})\.(\d{1,2})/.exec(t);
    if (a) { y = +a[1]; m = +a[2]; d = +a[3]; }
    else if ((a = /^(R|H|S|令和|平成|昭和)?\.?(\d{1,2})\.(\d{1,2})\.(\d{1,2})$/i.exec(t))) {
      const k = { '令和': 'R', '平成': 'H', '昭和': 'S' }[a[1]] || (a[1] || 'R').toUpperCase();
      y = ERAS.find(e => e[0] === k)[1] + Number(a[2]); m = +a[3]; d = +a[4];
    } else return String(v);
  }
  const iso = y + '-' + pad2(m) + '-' + pad2(d), e = ERAS.find(x => iso >= x[2]) || ERAS[2];
  return e[0] + (y - e[1]) + '.' + pad2(m) + '.' + pad2(d);
}
// 和暦 → 比較用の「YYYY-MM-DD」
function wKey(w) {
  const a = /^([RHS])(\d+)\.(\d+)\.(\d+)$/.exec(w || ''); if (!a) return '';
  return (ERAS.find(e => e[0] === a[1])[1] + Number(a[2])) + '-' + pad2(a[3]) + '-' + pad2(a[4]);
}
const today = () => toWareki(new Date());
// 「R8.04.12」→「令和8年」（日付の横に表示する）
function eraLabel(w) {
  const a = /^([RHS])(\d+)\./.exec(w || ''); if (!a) return '';
  return { R: '令和', H: '平成', S: '昭和' }[a[1]] + (a[2] === '1' ? '元' : a[2]) + '年';
}
// 日付（2026-10-22 または R8.10.22）→「10/22」
const md = v => { const a = /\.(\d+)\.(\d+)$/.exec(toWareki(v)); return a ? Number(a[1]) + '/' + Number(a[2]) : (v || ''); };
const yen = v => (v === '' || v == null || isNaN(Number(v))) ? (v || '') : Number(v).toLocaleString('ja-JP') + '円';
const isDone = st => /完了|販売済/.test(st || '');
function stCls(s) {
  if (!s) return 'gy';
  if (/不足|要判断|未登録/.test(s)) return 'ng';
  if (/完了|販売済|展示中/.test(s)) return 'ok';
  if (/変更済/.test(s)) return 'gy';
  return 'wt';
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function loading(on) {
  let el = document.getElementById('loading');
  if (on && !el) { el = document.createElement('div'); el.id = 'loading'; el.className = 'loading'; el.textContent = '読み込み中…'; document.body.appendChild(el); }
  if (!on && el) el.remove();
}
async function api(action, params = {}, post = false) {
  if (API_URL.includes('XXXXXXXX')) throw new Error('index.html の API_URL を設定してください');
  const res = post
    ? await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: TOKEN }, params)) })
    : await fetch(API_URL + '?' + new URLSearchParams(Object.assign({ action, token: TOKEN }, params)));
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}
async function loadList(showSpinner) {
  if (showSpinner) loading(true);
  try {
    const j = await api('list');
    S.rows = j.rows; S.options = j.options || { models: {} };
  } finally { loading(false); }
}
const svgBack = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const svgQr = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><rect x="8" y="8" width="8" height="8"/></svg>';
const svgCheck = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';

/* ===== ルーティング ===== */
window.addEventListener('hashchange', route);
async function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  if (h !== '/scan') stopCamera();
  if (h.indexOf('/car/') !== 0) S.detail = null;
  try {
    if (!S.rows) await loadList(true);
    if (h === '/scan') showScan();
    else if (h === '/new') showForm();
    else if (h.indexOf('/car/') === 0) await showDetail(h.slice(5));
    else showList();
  } catch (e) {
    app.innerHTML = '<div class="wrap"><main><div class="alert"><b>読み込めませんでした</b><span>' + esc(e.message) + '</span></div>' +
      '<button class="btn s" type="button" onclick="S.rows=null;route()">再読み込み</button></main></div>';
  }
}

/* ===== ① 一覧 ===== */
function nextText(m) {
  const s = m._sub, meth = m['処分方法'];
  if (m['ステータス'] === '書類不足') return '書類 ' + (m['書類判定'] || '');
  if (m['ステータス'] === '所有権解除待ち') return '所有権解除 ' + (m['解除状況'] || '依頼前');
  if (m['ステータス'] === '名義処理未定') return '抹消か名変かを決める';
  if (/抹消待ち|名変待ち/.test(m['ステータス'] || '')) return (m['名義処理'] || '') + ' 完了日を入力';
  if (!s) return meth === '未定' || !meth ? '処分方法が未定' : '';
  if (meth === '出品') {
    if (s['結果'] === '落札') return '入金予定 ' + (md(s['入金予定']) || '未定');
    if (s['結果']) return s['結果'];
    if (s['引取日']) return [s['会場'], md(s['出品予定'])].filter(Boolean).join(' ') || '出品待ち';
    if (s['陸送依頼']) return '陸送引取 ' + (md(s['引取予定']) || '未定');
    return '陸送を手配';
  }
  if (meth === '解体') return s['引取日'] ? '解体証明待ち' : [s['解体業者'], '引取 ' + (md(s['引取予定']) || '未定')].filter(Boolean).join(' ');
  if (meth === '再販') return s['作業完了'] ? '展示 ' + (md(s['展示予定']) || '未定') : [s['作業内容'], '仕上がり ' + (md(s['仕上がり予定']) || '未定')].filter(Boolean).join(' ');
  return '';
}
function showList() {
  app.innerHTML =
    '<div class="wrap"><div class="top">' +
      '<div class="row between"><div><div class="muted">サンアイク</div><h1>買取・下取り管理</h1></div>' +
      '<div class="row">' + (SHEET_URL ? '<a class="icon" href="' + esc(SHEET_URL) + '" target="_blank" rel="noopener" aria-label="スプレッドシートを開く"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="3" fill="#188038"/><path d="M5 8h12M5 12h12M5 16h12M10 5v13" stroke="#fff" stroke-width="1.6" fill="none"/></svg></a>' : '') +
      '<button class="icon" type="button" id="reload" aria-label="最新の状態に更新"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F3A5F" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div></div>' +
      '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
      '<input id="q" type="search" aria-label="車両を検索" placeholder="登録番号・車名・管理Noで検索" value="' + esc(S.q) + '"></label>' +
      '<div class="chips" id="chips"></div>' +
    '</div><main id="cards"></main>' +
    '<div class="bar"><a class="btn p" href="#/scan">' + svgQr + '車検証を読み取って登録</a></div></div>';
  document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; renderCards(); });
  document.getElementById('reload').addEventListener('click', async () => { try { await loadList(true); renderCards(); toast('更新しました'); } catch (e) { toast(e.message); } });
  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('[data-filter]'); if (!b) return;
    S.filter = b.dataset.filter; renderCards();
  });
  renderCards();
}
function renderCards() {
  const rows = S.rows || [];
  const active = rows.filter(r => !isDone(r['ステータス']));
  const counts = {};
  active.forEach(r => { const k = r['ステータス'] || '未設定'; counts[k] = (counts[k] || 0) + 1; });
  const chips = [['すべて', active.length]].concat(Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map(k => [k, counts[k]]), [['完了', rows.length - active.length]]);
  if (!chips.some(c => c[0] === S.filter)) S.filter = 'すべて';
  document.getElementById('chips').innerHTML = chips.map(c =>
    '<button type="button" class="fc' + (c[0] === S.filter ? ' on' : '') + '" data-filter="' + esc(c[0]) + '">' + esc(c[0]) + ' ' + c[1] + '</button>').join('');

const READ_OPTS = { formats: ['QRCode'], tryHarder: true, maxNumberOfSymbols: 8 };
function newScan() { return { parts: {}, qr: {}, done: { 2: false, 3: false }, stream: null, timer: null, busy: false, msg: '' }; }

    '<div class="view"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div>' +
    '<p id="scanmsg" style="text-align:center;font-size:14px;color:#D7DADF;margin:10px 16px">車検証のQRコードを枠に合わせてください（複数のQRを一度に写してもOK）</p>' +

      '<button class="link" type="button" id="manual">QRが読めないときは手入力する</button>' +

  document.getElementById('photo').addEventListener('change', async e => {
    for (const file of e.target.files) {
      try { onCodes(await ZXingWASM.readBarcodes(file, READ_OPTS)); } catch (err) { toast('画像を読み取れませんでした'); }
    }
    e.target.value = '';
  });

}
async function startCamera() {
  const msg = document.getElementById('scanmsg');
  if (typeof ZXingWASM === 'undefined') { msg.textContent = '読み取り機能を読み込めませんでした。通信状況を確認してください。'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    if (location.hash !== '#/scan') { stream.getTracks().forEach(t => t.stop()); return; }
    S.scan.stream = stream;
    const v = document.getElementById('video');
    v.srcObject = stream; await v.play();
    loop();
  } catch (e) {
    msg.textContent = 'カメラを使えません。「写真から読み取る」を使ってください。';
  }
}
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
function loop() {
  const sc = S.scan; if (!sc || !sc.stream) return;
  sc.timer = setTimeout(async () => {
    const v = document.getElementById('video');
    if (v && v.videoWidth && !sc.busy) {
      sc.busy = true;
      try {
        canvas.width = v.videoWidth; canvas.height = v.videoHeight;
        ctx.drawImage(v, 0, 0);
        onCodes(await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, canvas.width, canvas.height), READ_OPTS));
      } catch (e) { /* 次のフレームで再試行 */ }
      sc.busy = false;
    }
    loop();
  }, 180);
}
function stopCamera() {
  const sc = S.scan; if (!sc) return;
  clearTimeout(sc.timer);
  if (sc.stream) sc.stream.getTracks().forEach(t => t.stop());
  sc.stream = null;
}
// 車検証のQRは「分割QR（連結）」。同じ組のQRをすべて集めてから結合し、Shift_JISで文字にする
function onCodes(results) {
  const sc = S.scan; if (!sc) return;
  let changed = false;
  (results || []).forEach(r => {
    if (r.isValid === false || !r.bytes) return;
    const bytes = new Uint8Array(r.bytes);
    if (r.sequenceSize > 1) {
      const key = r.sequenceId + '|' + r.sequenceSize;
      const p = sc.parts[key] || (sc.parts[key] = { size: r.sequenceSize, got: {}, done: false });
      if (p.done || p.got[r.sequenceIndex]) return;
      p.got[r.sequenceIndex] = bytes; changed = true;
      if (Object.keys(p.got).length === p.size) {
        const all = [];
        for (let i = 0; i < p.size; i++) all.push(...p.got[i]);
        p.done = true;
        applyText(decodeSjis(new Uint8Array(all)));
      }
    } else if (applyText(decodeSjis(bytes))) changed = true;
  });
  if (changed) { renderCodes(); if (navigator.vibrate) navigator.vibrate(30); }
  if (sc.done[2] && sc.done[3]) finishScan();
}
function decodeSjis(bytes) {
  try { return new TextDecoder('shift_jis').decode(bytes); } catch (e) { return new TextDecoder().decode(bytes); }
}
function applyText(text) {
  const r = parseShaken(text);

  Object.assign(S.scan.qr, r.fields);
  S.scan.done[r.kind] = true;
  return true;
}
const z2h = t => t.replace(/[０-９Ａ-Ｚａ-ｚ－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
// 登録番号は全角12文字（標板文字4・分類番号3・かな1・一連番号4、空きは全角スペース）→「袖ヶ浦300あ1234」の形にする
function fmtReg(s) {
  const strip = t => z2h(t).replace(/[\s　・]/g, '');

}
function ymd(s) { s = (s || '').trim(); return /^\d{6}$/.test(s) && s !== '999999' ? (2000 + Number(s.slice(0, 2))) + '-' + s.slice(2, 4) + '-' + s.slice(4, 6) : ''; }
// 型式「5BA-HA36S」→「HA36S」（車名の自動入力に使う。シートには保存しない）
const baseModel = m => String(m || '').trim().split('-').pop();
// 車検証QRの解析（区切りは「/」）
//  軽自動車（軽自動車検査協会）：先頭が「K」、2番目がバージョン（コード2＝「22」、コード3＝「32」）
//  普通車（国交省）：先頭がバージョン「2」
function parseShaken(text) {
  const f = (text || '').split('/');
  const kei = f[0] === 'K';
  const v = kei ? f.slice(2) : f.slice(1);
  const code = kei ? String(f[1] || '').charAt(0) : (f.length >= 15 ? '3' : f.length >= 5 && f.length <= 8 ? '2' : '');
  if (code === '2') {
    // v = [車両番号, 標板, 車台番号, 原動機型式, 帳票種別]
    return { kind: 2, fields: { '登録番号': fmtReg(v[0] || ''), '車台番号': (v[2] || '').trim(), '軽・普通': kei ? '軽' : '普通' } };
  }
  if (code === '3') {
    // 軽: v = [打刻位置, 型式指定番号, 満了日, 初度検査, 型式, …]
    // 普通: v = [打刻位置, 型式指定番号, 999999, 満了日, 満了日, 初度登録, 型式, …]
    const fields = kei
      ? { '車検満了': toWareki(ymd(v[2])), '型式': (v[4] || '').trim() }
      : { '車検満了': toWareki(ymd(v[3]) || ymd(v[4])), '型式': (v[6] || '').trim() };

}
function renderCodes() {
  const sc = S.scan, el = document.getElementById('codes'); if (!el) return;

  const row = (kind, size, label) => {
    const n = sc.done[kind] ? size : prog(size);
    const cls = sc.done[kind] ? 'code done' : n ? 'code part' : 'code';
    return '<div class="' + cls + '">' + (sc.done[kind] ? svgCheck : '<span style="width:18px"></span>') +
      '<span class="grow">' + label + '</span><span style="font-size:13px;font-weight:700">' + n + ' / ' + size + '</span></div>';
  };
  el.innerHTML = '<div class="row between"><h2>読み取り状況</h2><span class="muted">QRは全部で5つ</span></div>' +
    row(2, 2, '登録番号・車台番号') + row(3, 3, '車検満了など');
}

    add('落札・入金', s['結果'] ? s['結果'] + (s['落札額'] ? ' ' + yen(s['落札額']) : '') + (s['入金日'] ? ' ・ 入金 ' + md(s['入金日']) : '') : '', s['入金日']);
  } else if (meth === '解体') {
    add('引取', [s['解体業者'], s['引取場所'], s['引取日'] ? '引取 ' + md(s['引取日']) : '予定 ' + (md(s['引取予定']) || '未定')].filter(Boolean).join(' ・ '), s['引取日']);
    add('解体証明', md(s['解体証明']), s['解体証明']);
  } else if (meth === '再販') {
    add('仕上げ作業', [s['作業内容'], s['作業完了'] ? '完了 ' + md(s['作業完了']) : '予定 ' + (md(s['仕上がり予定']) || '未定')].filter(Boolean).join(' ・ '), s['作業完了']);
    add('展示', [s['展示場所'], md(s['展示予定'])].filter(Boolean).join(' ・ '), s['作業完了'] && s['展示予定'] && wKey(toWareki(s['展示予定'])) <= wKey(today()));
    add('販売', s['販売日'] ? md(s['販売日']) + (s['販売価格'] ? ' ・ ' + yen(s['販売価格']) : '') : '', s['販売日']);
  } else if (meth === '社用車' || meth === 'レンタカー') {
    add(meth + 'として使用', '', true);
  } else {
    add('処分方法を決める', '出品・解体・再販・社用車・レンタカーから選択', false);
  }
  // どの処分方法でも、最後に抹消か名変（またはお客様名義のまま）
  if (meth && meth !== '未定') {
    const k = m['名義処理'];
    if (k === 'お客様名義のまま') add('名義', 'お客様名義のまま', true);
    else add(k || '抹消・名変', m['完了日'] ? '完了 ' + md(m['完了日']) : m['申請日'] ? '申請 ' + md(m['申請日']) : k ? '未申請' : '抹消か名変かを決める', m['完了日']);
  }
  let nowSet = false;
  st.forEach(x => { x.state = x.done ? 'done' : nowSet ? 'next' : (nowSet = true, 'now'); });
  return st;
}
function renderDetail() {
  const D = S.detail, m = D.data.master, s = D.data.sub, hist = D.data.history || [];
  const meth = m['処分方法'] || '未定';
  const ed = D.edits;
  const val = (scope, k) => (k in ed[scope]) ? ed[scope][k] : (scope === 'master' ? m : s || {})[k];
  const field = (scope, k, type) => '<label class="f' + (type === 'date' ? ' full' : '') + '">' + esc(k) +
    control(k, type, val(scope, k), 'data-scope="' + scope + '" data-k="' + esc(k) + '"', (k in ed[scope]) ? 'dirty' : '') + '</label>';
  const group = (title, scope, defs, open, badge) => '<details class="sec"' + (open ? ' open' : '') + '><summary>' + esc(title) + (badge || '') + '</summary><div class="body"><div class="grid2">' +
    defs.map(f => field(scope, f[0], f[1])).join('') + '</div></div></details>';
  const st = steps(m, s);
  const cur = (st.find(x => x.state === 'now') || {}).t || '';
  const dirty = Object.keys(ed.master).length + Object.keys(ed.sub).length;

  app.innerHTML =
    '<div class="wrap"><div class="top" style="flex-direction:row;align-items:flex-start;gap:4px;padding:10px 8px 12px">' +
      '<a class="icon" href="#/" aria-label="一覧に戻る">' + svgBack + '</a>' +
      '<div class="grow" style="display:flex;flex-direction:column;gap:4px;padding-top:4px">' +
        '<span class="muted">' + esc([m['管理No'], m['区分'], m['担当'] ? '担当 ' + m['担当'] : ''].filter(Boolean).join(' ・ ')) + '</span>' +
        '<span style="font-size:20px;font-weight:700">' + esc(m['車名'] || '（車名未入力）') + '</span>' +
        '<span style="font-size:14px;color:#3C4043">' + esc(m['登録番号']) + (m['車台番号'] ? ' ・ ' + esc(m['車台番号']) : '') + '</span>' +
        '<div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip ' + stCls(m['ステータス']) + '">' + esc(m['ステータス'] || '—') + '</span>' +
        '<span class="chip ' + (Number(m['変更']) > 0 ? 'pu' : 'ac') + '">' + esc(meth) + '</span>' +
        (m['経過日'] !== '' && m['経過日'] != null ? '<span class="muted">入庫から' + esc(m['経過日']) + '日</span>' : '') + '</div>' +
      '</div></div><main>' +
      (m['アラート'] ? '<div class="alert"><b>' + esc(m['アラート']) + '</b></div>' : '') +
      '<section class="sec"><h2>進捗</h2><div class="steps">' + st.map((x, i) =>
        '<div class="st"><div class="rail"><div class="dot d-' + x.state + '" style="color:#fff">' + (x.state === 'done' ? svgCheck : '') + '</div>' + (i < st.length - 1 ? '<div class="ln"></div>' : '') + '</div>' +
        '<div class="tx"><span class="t-' + x.state + '" style="font-size:14px">' + esc(x.t) + '</span>' + (x.sub ? '<span class="muted">' + esc(x.sub) + '</span>' : '') + '</div></div>').join('') + '</div></section>' +
      (s ? group(meth + 'の進捗', 'sub', F[meth] || [], /陸送|出品|落札|引取|解体|仕上げ|展示|販売/.test(cur)) : '') +
      group('書類', 'master', F.docs, cur === '書類', m['書類判定'] && m['書類判定'] !== '揃い' ? ' <span class="chip ng">' + esc(m['書類判定']) + '</span>' : '') +
      group('所有権解除', 'master', F.owner, cur === '所有権解除') +
      group('名義（抹消・名変）', 'master', F.meigi, /抹消|名変|名義/.test(cur)) +
      group('金額・支払', 'master', F.money, false) +
      group('基本情報', 'master', F.basic, false) +
      '<details class="sec"' + (cur === '処分方法を決める' ? ' open' : '') + '><summary>処分方法を変更</summary><div class="body">' +
        seg('_method', METHODS, D.newMethod || meth) +
        '<label class="f">変更の理由<input class="in" id="reason" placeholder="流札のため" value="' + esc(D.reason || '') + '"></label>' +
        '<span class="muted" style="line-height:1.6">変更すると新しいシートに行が追加され、元のシートの行は「変更済」として残ります。</span>' +
        '<button class="btn s" type="button" id="changeMethod">変更する</button></div></details>' +
      (hist.length || m['最終変更'] ? '<section class="sec"><h2>変更履歴</h2>' + (m['最終変更'] ? '<span style="font-size:13px">最終変更：' + esc(m['最終変更']) + '</span>' : '') +
        hist.map(h => '<div class="hist"><span>' + esc(h._method) + (h['変更元'] ? '（' + esc(h['変更元']) + '）' : '') + '</span><span class="chip gy">変更済</span></div>').join('') + '</section>' : '') +
    '</main>' +
    (dirty ? '<div class="bar"><button class="btn p" type="button" id="save">変更を保存（' + dirty + '件）</button><button class="link" type="button" id="discard">取り消す</button></div>' : '') +
    '</div>';

  app.querySelectorAll('[data-scope]').forEach(el => el.addEventListener('change', () => {
    const scope = el.dataset.scope, k = el.dataset.k;
    const val = el.dataset.date ? toWareki(el.value) : el.value;
    const orig = (scope === 'master' ? m : s || {})[k];
    const before = el.dataset.date ? toWareki(orig) : String(orig == null ? '' : orig);
    if (before === val) delete ed[scope][k]; else ed[scope][k] = val;
    const open = Array.from(app.querySelectorAll('details')).map(x => x.open);
    const y = window.scrollY;
    renderDetail();
    app.querySelectorAll('details').forEach((x, i) => { x.open = open[i]; });
    window.scrollTo(0, y);
  }));
  app.querySelectorAll('[data-seg="_method"]').forEach(el => el.addEventListener('click', () => {
    D.newMethod = el.dataset.v; D.reason = (document.getElementById('reason') || {}).value || '';
    const open = Array.from(app.querySelectorAll('details')).map(x => x.open), y = window.scrollY;
    renderDetail();
    app.querySelectorAll('details').forEach((x, i) => { x.open = open[i]; });
    window.scrollTo(0, y);
  }));
  document.getElementById('changeMethod').addEventListener('click', async () => {
    const nm = D.newMethod || meth, reason = document.getElementById('reason').value.trim();
    if (nm === meth) { toast('処分方法を選んでください'); return; }
    if (!confirm('処分方法を「' + meth + '」から「' + nm + '」に変更しますか？')) return;
    loading(true);
    try {
      const j = await api('changeMethod', { no: D.no, method: nm, reason }, true);
      S.detail = { no: D.no, data: j, edits: { master: {}, sub: {} } }; S.rows = null;
      renderDetail(); toast('「' + nm + '」に変更しました');
    } catch (e) { toast(e.message); } finally { loading(false); }
  });
  const save = document.getElementById('save');
  if (save) save.addEventListener('click', async () => {
    loading(true);
    try {
      const j = await api('update', { no: D.no, master: ed.master, sub: ed.sub }, true);
      S.detail = { no: D.no, data: j, edits: { master: {}, sub: {} } }; S.rows = null;
      renderDetail(); toast('保存しました');
    } catch (e) { toast(e.message); } finally { loading(false); }
  });
  const discard = document.getElementById('discard');
  if (discard) discard.addEventListener('click', () => { D.edits = { master: {}, sub: {} }; renderDetail(); });
}

route();
</script>
</body>
</html>
